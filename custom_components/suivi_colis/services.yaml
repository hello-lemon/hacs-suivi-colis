add_package:
  name: Ajouter un colis
  description: Ajouter un numéro de suivi à tracker
  fields:
    tracking_number:
      name: Numéro de suivi
      description: Le numéro de suivi du colis
      required: true
      example: "XX123456789FR"
      selector:
        text:
    friendly_name:
      name: Nom
      description: Nom personnalisé pour le colis (optionnel)
      required: false
      example: "Clavier MX Keys"
      selector:
        text:
    carrier:
      name: Transporteur
      description: "Transporteur (optionnel, détecté automatiquement)"
      required: false
      example: "chronopost"
      selector:
        select:
          options:
            - label: "Auto-detect"
              value: ""
            - label: "Chronopost"
              value: "chronopost"
            - label: "Colissimo"
              value: "colissimo"
            - label: "La Poste"
              value: "laposte"
            - label: "DHL"
              value: "dhl"
            - label: "UPS"
              value: "ups"
            - label: "Amazon"
              value: "amazon"
            - label: "Cainiao"
              value: "cainiao"

remove_package:
  name: Supprimer un colis
  description: Arrêter le suivi d'un colis
  fields:
    tracking_number:
      name: Numéro de suivi
      description: Le numéro de suivi à supprimer
      required: true
      example: "XX123456789FR"
      selector:
        text:

refresh:
  name: Rafraîchir
  description: Forcer une mise à jour immédiate de tous les colis

archive_delivered:
  name: Archiver les livrés
  description: Archiver tous les colis marqués comme livrés

change_carrier:
  name: Changer de transporteur
  description: >-
    Suivre un colis chez un autre transporteur (transporteur mal détecté).
    17track limite à 5 changements par colis.
  fields:
    tracking_number:
      name: Numéro de suivi
      description: Le numéro de suivi du colis
      required: true
      example: "CH514085194DE"
      selector:
        text:
    carrier:
      name: Transporteur
      description: Nouveau transporteur
      required: false
      example: "dhl_paket"
      selector:
        select:
          options:
            - label: "La Poste / Colissimo"
              value: "colissimo"
            - label: "Chronopost"
              value: "chronopost"
            - label: "Colis Privé"
              value: "colisprive"
            - label: "Mondial Relay"
              value: "mondialrelay"
            - label: "Relais Colis"
              value: "relaiscolis"
            - label: "DPD France"
              value: "dpd"
            - label: "GLS France"
              value: "gls"
            - label: "UPS"
              value: "ups"
            - label: "FedEx"
              value: "fedex"
            - label: "TNT France"
              value: "tnt"
            - label: "DHL Paket / Deutsche Post"
              value: "dhl_paket"
            - label: "DHL Express"
              value: "dhl_express"
            - label: "Amazon Shipping (FR)"
              value: "amazon"
            - label: "Vinted Go"
              value: "vintedgo"
            - label: "Cainiao (AliExpress)"
              value: "cainiao"
    carrier_code:
      name: Code transporteur 17track
      description: >-
        Pour un transporteur absent de la liste : son code 17track (colonne
        « key » de la liste des transporteurs 17track). Prioritaire sur le
        champ Transporteur.
      required: false
      example: 100304
      selector:
        number:
          min: 1
          max: 999999
          mode: box
